name: daily-run

on:
  schedule:
    # Istanbul = UTC+3 (no DST). GitHub often starts scheduled runs late, so there
    # are several runs; each one is safe to repeat (sessions are frozen once final).
    - cron: "0 16 * * 1-5"    # 19:00 Istanbul, after the closing auction + Yahoo delay
    - cron: "0 18 * * 1-5"    # 21:00 retry
    - cron: "30 21 * * 1-5"   # 00:30 retry
    - cron: "0 4 * * 2-6"     # 07:00 next morning, last catch-up before the open
  workflow_dispatch:          # "Run workflow" button for manual runs / catch-up

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ENS5v2 pipeline (friend's code, Yahoo + Is Yatirim)
        id: ens5
        continue-on-error: true
        run: python -W ignore ens5/run_ens5.py
      - name: Run strategies
        id: run
        run: |
          set +e
          python -W ignore run.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = ok, 2 = written but needs attention, anything else = hard failure
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Commit updated log
        run: |
          git config user.name "strategy-bot"
          git config user.email "strategy-bot@users.noreply.github.com"
          git add docs/data ens5/state ens5/out
          git diff --cached --quiet || git commit -m "log: $(date -u +%F)"
          git pull --rebase
          git push
      - name: Flag partial problems (sends GitHub's failure email)
        if: steps.run.outputs.code == '2' || steps.ens5.outcome == 'failure'
        run: |
          echo "::error::ENS5 step failed, a strategy failed, or Yahoo data was incomplete - see the logs above."
          exit 1
