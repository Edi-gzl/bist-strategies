name: daily-run

on:
  schedule:
    # Istanbul = UTC+3 (no DST). GitHub delays scheduled runs by hours at busy times,
    # worst on the hour, so runs use off-peak minutes and repeat through the evening.
    # Every run is safe to repeat: a session is only recorded once it has closed.
    - cron: "37 15 * * 1-5"   # 18:37 Istanbul
    - cron: "13 16 * * 1-5"   # 19:13
    - cron: "43 16 * * 1-5"   # 19:43
    - cron: "17 17 * * 1-5"   # 20:17
    - cron: "47 17 * * 1-5"   # 20:47
    - cron: "23 19 * * 1-5"   # 22:23
    - cron: "53 21 * * 1-5"   # 00:53
    - cron: "11 4 * * 2-6"    # 07:11 next morning, last catch-up before the open
  workflow_dispatch:          # "Run workflow" button for manual runs / catch-up

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore ENS5 state (kept on branch ens5-state, overwritten each run)
        run: |
          mkdir -p ens5/state
          if git fetch -q origin ens5-state; then
            git archive FETCH_HEAD | tar -x -C ens5/state
          fi
          ls -la ens5/state
      - name: ENS5v2 pipeline (friend's code, Yahoo + Is Yatirim)
        id: ens5
        continue-on-error: true
        run: python -W ignore ens5/run_ens5.py
      - name: Run strategies
        id: run
        run: |
          set +e
          python -W ignore run.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = ok, 2 = written but needs attention, anything else = hard failure
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Commit updated log
        run: |
          git config user.name "strategy-bot"
          git config user.email "strategy-bot@users.noreply.github.com"
          git add docs/data ens5/out
          git diff --cached --quiet || git commit -m "log: $(date -u +%F)"
          git pull --rebase
          git push
      - name: Save ENS5 state (single commit, force-pushed so the repo does not grow)
        if: steps.ens5.outcome == 'success'
        run: |
          R="$GITHUB_WORKSPACE"
          cd ens5/state
          export GIT_INDEX_FILE="$(mktemp -u)"
          git --git-dir="$R/.git" --work-tree=. add -A
          tree=$(git --git-dir="$R/.git" write-tree)
          commit=$(git --git-dir="$R/.git" commit-tree "$tree" -m "ens5 state $(date -u +%FT%H:%MZ)")
          git --git-dir="$R/.git" push -f origin "$commit:refs/heads/ens5-state"
      - name: Flag partial problems (sends GitHub's failure email)
        if: steps.run.outputs.code == '2' || steps.ens5.outcome == 'failure'
        run: |
          echo "::error::ENS5 step failed, a strategy failed, or Yahoo data was incomplete - see the logs above."
          exit 1
