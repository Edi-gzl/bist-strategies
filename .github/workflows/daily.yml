name: daily-run

on:
  schedule:
    # 19:00 Istanbul (UTC+3, no DST), Mon-Fri: closing auction ends 18:10 and
    # Yahoo's BIST feed can lag ~15 min, so wait before reading the day's prices.
    - cron: "0 16 * * 1-5"
    # 21:00 Istanbul retry: catches a session Yahoo hadn't finished publishing at 19:00.
    - cron: "0 18 * * 1-5"
  workflow_dispatch:          # "Run workflow" button for manual runs / catch-up

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run strategies
        id: run
        run: |
          set +e
          python -W ignore run.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = ok, 2 = written but needs attention, anything else = hard failure
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Commit updated log
        run: |
          git config user.name "strategy-bot"
          git config user.email "strategy-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "log: $(date -u +%F)"
          git pull --rebase
          git push
      - name: Flag partial problems (sends GitHub's failure email)
        if: steps.run.outputs.code == '2'
        run: |
          echo "::error::A strategy failed or Yahoo data was incomplete - see the 'Run strategies' log."
          exit 1
